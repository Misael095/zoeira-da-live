
name: Publicar Zoeira da Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: unzip zoeira-da-live-pronto-github-corrigido.zip -d app

      - name: Corrigir dependência
        run: cd app && npm pkg set 'devDependencies.esbuild=^0.28.2'

      - name: Instalar dependências
        run: cd app && npm install

      - name: Compilar aplicativo
        run: cd app && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
